name: Tests

on:
  pull_request:
    branches: [ main-complexity ]

permissions:
  contents: read
  issues: read
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          path: main-repo

      - name: Checkout test repository
        uses: actions/checkout@v3
        with:
          repository: teamcubation-client/accenture-tests
          path: test-repo
          ref: main
          token: ${{ secrets.ACCENTURE_TESTS_PAT }}

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Copy tests to main repository
        run: cp -R test-repo/src/test main-repo/src/

      - name: Build and test with Maven
        run: |
          cd main-repo
          mvn clean test
          
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: "**/surefire-reports/TEST-*.xml"